[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bicameral"
version = "0.1.0"
description = "Two-model coding orchestrator for Claude Code: one model plans and reviews, another writes the diffs, with learned routing, test verification and reflective memory."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "devilz06" }]
keywords = ["claude-code", "coding-agent", "developer-tools", "llm", "mcp", "orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "anthropic>=1.0",
  "openai>=1.70",
  "mcp>=2.0",
  "pydantic>=2.0",
  "textual>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bicameral = "bicameral.cli:main"
bicameral-mcp = "bicameral.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Devilz06/Bicameral"
Repository = "https://github.com/Devilz06/Bicameral"
Issues = "https://github.com/Devilz06/Bicameral/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bicameral = ["evals/tasks/**/*", "skill/*.md", "tui/*.tcss", "gui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "UP", # pyupgrade
  "B",  # bugbear
  "C4", # comprehensions
]
# Prompt strings and log lines run long on purpose; keep new code within line-length where it reads better.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/bicameral/evals/tasks/**" = ["ALL"] # eval fixtures contain deliberate bugs
