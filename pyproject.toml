[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bicameral"
version = "0.1.0"
description = "Self-improving architect/editor orchestrator: a reasoning model plans and reviews, a coding model writes the diffs, and learned routing, reflective memory and retrieved examples make delegation measurably better over time."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "devilz06" }]
keywords = ["llm", "agents", "coding-agent", "orchestration", "anthropic", "openai"]
dependencies = [
  "anthropic>=1.0",
  "openai>=1.70",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bicameral = "bicameral.cli:main"

[project.urls]
Repository = "https://github.com/devilz06/Bicameral"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bicameral = ["evals/tasks/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
