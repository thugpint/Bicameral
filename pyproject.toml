[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bicameral"
version = "0.1.0"
description = "Self-improving architect/editor orchestrator: a reasoning model plans and reviews, a coding model writes the diffs, and learned routing, reflective memory and retrieved examples make delegation measurably better over time."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "devilz06" }]
keywords = ["llm", "agents", "coding-agent", "orchestration", "anthropic", "openai", "claude-code", "mcp", "tui"]
dependencies = [
  "anthropic>=1.0",
  "openai>=1.70",
  "mcp>=2.0",
  "pydantic>=2.0",
  "textual>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bicameral = "bicameral.cli:main"
bicameral-mcp = "bicameral.mcp_server:main"

[project.urls]
Repository = "https://github.com/devilz06/Bicameral"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bicameral = ["evals/tasks/**/*", "skill/*.md", "tui/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
