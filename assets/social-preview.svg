<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">Bicameral — Two minds. One diff. Self-improving two-model coding agent for Claude Code</title>
  <desc id="d">Social preview card for the Bicameral GitHub repository. Claude plans and reviews, Codex or a second Claude writes the code, every step is routed, test-verified and learned from.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0912"/><stop offset="1" stop-color="#171436"/></linearGradient>
    <linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="gE" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.4" r="0.6"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowE" cx="0.95" cy="0.1" r="0.6"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <clipPath id="left"><rect x="0" y="0" width="122" height="256"/></clipPath>
    <clipPath id="right"><rect x="134" y="0" width="122" height="256"/></clipPath>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glowA)"/>
  <rect width="1280" height="640" fill="url(#glowE)"/>

  <g transform="translate(96 170) scale(1.2)">
    <g clip-path="url(#left)">
      <circle cx="128" cy="128" r="104" fill="url(#gA)"/>
      <g stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none"><path d="M84 84 V172"/><path d="M84 100 H112"/><path d="M84 128 H112"/><path d="M84 156 H112"/></g>
      <g fill="#fff"><circle cx="84" cy="84" r="9"/><circle cx="112" cy="100" r="6"/><circle cx="112" cy="128" r="6"/><circle cx="112" cy="156" r="6"/></g>
    </g>
    <g clip-path="url(#right)">
      <circle cx="128" cy="128" r="104" fill="url(#gE)"/>
      <g stroke="#fff" stroke-width="8" stroke-linecap="round"><path d="M150 100 H196"/><path d="M150 128 H180"/><path d="M150 156 H196"/></g>
      <g stroke="#0b1220" stroke-width="5" stroke-linecap="round" opacity="0.55"><path d="M160 90 V110"/><path d="M150 128 H180"/></g>
    </g>
    <rect x="116" y="118" width="24" height="20" rx="10" fill="url(#gB)"/>
    <circle cx="128" cy="128" r="5" fill="#fff"/>
  </g>

  <g font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="470" y="270" font-size="104" font-weight="800" fill="#ece9fb" letter-spacing="-4">Bicameral</text>
    <text x="474" y="335" font-size="40" font-weight="700" fill="url(#gB)">Two minds. One diff.</text>
    <text x="474" y="392" font-size="24" fill="#b3aed4">Claude plans &amp; reviews. A second model writes the code.</text>
    <text x="474" y="428" font-size="24" fill="#b3aed4">Every step routed, test-verified, and learned from.</text>
    <g transform="translate(474 470)">
      <rect width="330" height="46" rx="12" fill="#0b0a14" stroke="#2b2750"/>
      <text x="18" y="30" font-size="20" font-family="JetBrains Mono, Consolas, monospace" fill="#22d3ee">/bicameral fix the failing test</text>
    </g>
    <text x="474" y="560" font-size="20" fill="#6f6a92">github.com/Devilz06/Bicameral · MIT · Python 3.11+</text>
  </g>
