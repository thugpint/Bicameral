<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t d">
  <title id="t">Bicameral logo — two-model AI coding agent for Claude Code</title>
  <desc id="d">A circle split into two hemispheres: a violet Architect half that plans and reviews, and a cyan Editor half that writes code, joined by a bridge in the middle. Bicameral pairs Claude with Codex (GPT-5) and learns which model to trust for each step.</desc>
  <defs>
    <linearGradient id="gA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="left"><rect x="0" y="0" width="122" height="256"/></clipPath>
    <clipPath id="right"><rect x="134" y="0" width="122" height="256"/></clipPath>
  </defs>

  <circle cx="128" cy="128" r="128" fill="url(#glow)"/>

  <!-- Architect hemisphere -->
  <g clip-path="url(#left)">
    <circle cx="128" cy="128" r="104" fill="url(#gA)"/>
    <!-- plan tree -->
    <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.95">
      <path d="M84 84 V172"/>
      <path d="M84 100 H112"/>
      <path d="M84 128 H112"/>
      <path d="M84 156 H112"/>
    </g>
    <g fill="#ffffff">
      <circle cx="84" cy="84" r="9"/>
      <circle cx="112" cy="100" r="6"/>
      <circle cx="112" cy="128" r="6"/>
      <circle cx="112" cy="156" r="6"/>
    </g>
  </g>

  <!-- Editor hemisphere -->
  <g clip-path="url(#right)">
    <circle cx="128" cy="128" r="104" fill="url(#gE)"/>
    <!-- diff lines -->
    <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.95">
      <path d="M150 100 H196"/>
      <path d="M150 128 H180"/>
      <path d="M150 156 H196"/>
    </g>
    <g stroke="#0b1220" stroke-width="5" stroke-linecap="round" opacity="0.55">
      <path d="M160 90 V110"/>
      <path d="M150 128 H180"/>
    </g>
  </g>

  <!-- bridge -->
  <rect x="116" y="118" width="24" height="20" rx="10" fill="url(#gB)"/>
  <circle cx="128" cy="128" r="5" fill="#ffffff"/>
</svg>
